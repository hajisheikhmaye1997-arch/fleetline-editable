<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleetline Driver</title>
<link rel="manifest" href="driver-manifest.json">
<meta name="theme-color" content="#14171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fleetline Driver">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181B18; --paper:#F2F1EC; --panel:#FFFFFF; --asphalt:#14171A;
    --line:#DAD7CE; --orange:#FF6A1A; --teal:#1E5F6E; --moss:#3F7D58; --brick:#B23A2E; --mute:#6B6F6A;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;
        padding-bottom:calc(132px + env(safe-area-inset-bottom,0px)); }
  button{ font-family:inherit; cursor:pointer; }

  .top{ background:var(--asphalt); color:#fff; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .mark{ width:26px; height:26px; border-radius:3px; background:var(--orange); display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed'; font-weight:700; font-size:14px; color:#161616; }
  .brand-name{ font-family:'Barlow Condensed'; font-weight:600; font-size:19px; letter-spacing:.2px; }
  .link-btn{ background:none; border:none; color:#C7C9C3; font-size:13px; text-decoration:underline; }

  .profile{ background:#20242A; color:#EDECE6; padding:9px 18px; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
  .profile b{ font-weight:600; }
  .profile .plate{ font-family:'Barlow Condensed'; font-weight:700; font-size:15px; letter-spacing:.5px; background:#fff; color:#181B18; padding:1px 8px; border-radius:3px; }
  .profile .unset{ color:#FFB48A; }

  .monthbar{ display:flex; align-items:center; justify-content:center; gap:18px; padding:16px 18px 6px; }
  .monthbar button{ width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:20px; line-height:1; color:var(--ink); }
  .month-label{ font-family:'Barlow Condensed'; font-size:24px; font-weight:700; min-width:170px; text-align:center; }

  .wrap{ max-width:560px; margin:0 auto; padding:8px 18px 0; }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:8px 0 18px; }
  .tile{ background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--teal); border-radius:6px; padding:11px 14px; }
  .tile.o{ border-left-color:var(--orange); } .tile.m{ border-left-color:var(--moss); } .tile.b{ border-left-color:var(--brick); }
  .tile .l{ font-size:12px; color:var(--mute); font-weight:500; }
  .tile .n{ font-family:'Barlow Condensed'; font-size:27px; font-weight:700; line-height:1.15; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:13px 15px; margin-bottom:10px; }
  .card:active{ background:#FAF9F6; }
  .c-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .c-route{ font-weight:700; font-size:15px; }
  .c-date{ font-size:12px; color:var(--mute); white-space:nowrap; }
  .c-meta{ font-size:13px; color:var(--mute); margin-top:5px; }
  .empty{ text-align:center; color:var(--mute); padding:34px 10px; font-size:14px; line-height:1.5; }

  .rep-row{ display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid #EFEDE6; font-size:14px; }
  .rep-row:last-child{ border-bottom:none; }
  .rep-row b{ font-weight:700; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 16px; }
  .rep-btns{ display:grid; gap:10px; margin-top:16px; }
  .btn{ width:100%; padding:14px; border-radius:8px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:15px; color:var(--ink); }
  .btn.primary{ background:var(--orange); border-color:var(--orange); color:#161616; }
  .btn.danger{ border:none; background:none; color:var(--brick); font-weight:600; font-size:14px; }
  .btn:disabled{ opacity:.45; }
  .note{ font-size:12.5px; color:var(--mute); margin-top:14px; line-height:1.5; }

  #fab{ position:fixed; right:18px; bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--orange); color:#161616; border:none; border-radius:28px; padding:15px 22px; font-weight:700; font-size:15px; box-shadow:0 4px 14px rgba(0,0,0,.28); z-index:20; }
  .tabs{ position:fixed; left:0; right:0; bottom:0; background:var(--asphalt); display:flex; padding-bottom:env(safe-area-inset-bottom,0px); z-index:20; }
  .tabs button{ flex:1; background:none; border:none; color:#B9BBB4; padding:17px 0; font-weight:600; font-size:14px; border-top:3px solid transparent; }
  .tabs button.on{ color:#fff; border-top-color:var(--orange); }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .overlay[hidden]{ display:none; }
  .sheet{ background:#fff; width:100%; max-width:560px; border-radius:14px 14px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); max-height:92vh; overflow-y:auto; }
  .sheet h3{ font-family:'Barlow Condensed'; font-size:22px; font-weight:700; margin-bottom:14px; }
  .fld{ display:block; margin-bottom:12px; }
  .fld span{ display:block; font-size:12px; font-weight:600; color:var(--mute); margin-bottom:4px; }
  .fld input{ width:100%; padding:12px; border:1px solid var(--line); border-radius:7px; font-size:16px; font-family:inherit; background:#fff; color:var(--ink); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .actions{ display:flex; gap:10px; margin-top:6px; }
  .actions .btn{ flex:1; }
  .sep{ border-top:1px solid var(--line); margin:16px 0 12px; }
  .sheet .h{ font-size:13px; font-weight:700; margin-bottom:8px; }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="mark">F</div><div class="brand-name">Fleetline Driver</div></div>
  <button class="link-btn" id="btn-settings">Settings</button>
</header>
<div class="profile" id="profile-bar"></div>

<div class="monthbar">
  <button id="prev" aria-label="Previous month">‹</button>
  <div class="month-label" id="month-label"></div>
  <button id="next" aria-label="Next month">›</button>
</div>

<div class="wrap">
  <section id="view-trips">
    <div class="tiles" id="tiles"></div>
    <div id="trip-list"></div>
  </section>

  <section id="view-report" hidden>
    <div class="panel" id="report-summary"></div>
    <div class="rep-btns">
      <button class="btn primary" id="btn-pdf">Download PDF report</button>
      <button class="btn" id="btn-xlsx">Download Excel report</button>
      <button class="btn" id="btn-share" hidden>Share Excel (WhatsApp, email…)</button>
    </div>
    <div class="note" id="report-note"></div>
  </section>
</div>

<button id="fab">+ Add trip</button>
<nav class="tabs">
  <button class="on" data-tab="trips">Trips</button>
  <button data-tab="report">Month-end report</button>
</nav>

<div class="overlay" id="overlay" hidden>
  <div class="sheet">
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
    <div class="actions" id="sheet-actions"></div>
  </div>
</div>

<script>
  const KEY = 'fleetline_driver_v1';
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
  const ksh = n => 'KSh ' + Math.round(n).toLocaleString('en-US');
  const f1 = n => (Math.round(n * 10) / 10).toLocaleString('en-US');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function fmtDate(iso){ if (!iso) return '—'; const p = iso.split('-'); return (+p[2]) + ' ' + MONTHS[+p[1]-1].slice(0,3) + ' ' + p[0]; }
  function fmtShort(iso){ if (!iso) return ''; const p = iso.split('-'); return (+p[2]) + ' ' + MONTHS[+p[1]-1].slice(0,3); }
  function todayIso(){ return new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10); }

  // ---------- storage (this phone only) ----------
  let state = load();
  function load(){
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.trips)) { s.profile = s.profile || {name:'', plate:''}; return s; }
    } catch(e) {}
    return { profile:{name:'', plate:''}, trips:[] };
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e) { alert('Could not save — phone storage may be full.'); }
  }

  // ---------- month + calculations ----------
  const now = new Date();
  let cur = { y: now.getFullYear(), m: now.getMonth() };
  let tab = 'trips';
  const monthKey = () => cur.y + '-' + String(cur.m + 1).padStart(2, '0');
  const monthLabel = () => MONTHS[cur.m] + ' ' + cur.y;

  function monthTrips(){
    const k = monthKey();
    return state.trips.filter(t => (t.start || '').startsWith(k))
      .sort((a, b) => a.start.localeCompare(b.start) || (a.id > b.id ? 1 : -1));
  }
  const cargoValue = t => num(t.tonnes) * num(t.price);
  const fuelCost = t => num(t.fuel) * num(t.fuelPrice);
  function totals(list){
    return list.reduce((a, t) => {
      a.trips++; a.tonnes += num(t.tonnes); a.cargo += cargoValue(t);
      a.fuel += num(t.fuel); a.fuelCost += fuelCost(t);
      a.allowance += num(t.allowance); a.other += num(t.other);
      return a;
    }, {trips:0, tonnes:0, cargo:0, fuel:0, fuelCost:0, allowance:0, other:0});
  }

  // ---------- rendering ----------
  function render(){
    const p = state.profile;
    $('profile-bar').innerHTML = (p.name || p.plate)
      ? `<span><b>${esc(p.name || 'Driver')}</b></span><span class="plate">${esc(p.plate || 'NO PLATE')}</span>`
      : `<span class="unset">Tap Settings to add your name and truck plate</span>`;
    $('month-label').textContent = monthLabel();

    const list = monthTrips(), t = totals(list);
    $('tiles').innerHTML =
      `<div class="tile"><div class="l">Trips</div><div class="n">${t.trips}</div></div>` +
      `<div class="tile o"><div class="l">Tonnes carried</div><div class="n">${f1(t.tonnes)} t</div></div>` +
      `<div class="tile m"><div class="l">Fuel used</div><div class="n">${f1(t.fuel)} L</div></div>` +
      `<div class="tile b"><div class="l">Allowance</div><div class="n">${ksh(t.allowance)}</div></div>`;

    $('trip-list').innerHTML = list.length ? list.map(x => `
      <div class="card" data-id="${esc(x.id)}">
        <div class="c-top"><span class="c-route">${esc(x.route)}</span><span class="c-date">${fmtShort(x.start)}${x.offload ? ' → ' + fmtShort(x.offload) : ''}</span></div>
        <div class="c-meta">${f1(num(x.tonnes))} t · ${f1(num(x.fuel))} L fuel · Allowance ${ksh(num(x.allowance))}</div>
      </div>`).join('')
      : `<div class="empty">No trips in ${monthLabel()} yet.<br>Tap <b>+ Add trip</b> to record one.</div>`;

    $('report-summary').innerHTML = [
      ['Trips', t.trips], ['Total tonnes', f1(t.tonnes) + ' t'], ['Cargo value', ksh(t.cargo)],
      ['Fuel used', f1(t.fuel) + ' L'], ['Fuel cost', ksh(t.fuelCost)],
      ['Driver allowance', ksh(t.allowance)], ['Other expenses', ksh(t.other)]
    ].map(r => `<div class="rep-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');

    const has = list.length > 0;
    $('btn-pdf').disabled = !has; $('btn-xlsx').disabled = !has; $('btn-share').disabled = !has;
    $('report-note').textContent = has
      ? 'Reports cover ' + monthLabel() + ' only. Use ‹ › at the top to pick another month. For the PDF, choose “Save as PDF” in the print screen.'
      : 'No trips recorded in ' + monthLabel() + ' — nothing to export.';

    $('view-trips').hidden = tab !== 'trips';
    $('view-report').hidden = tab !== 'report';
    $('fab').hidden = tab !== 'trips';
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  }

  // ---------- bottom sheet ----------
  function openSheet(title, bodyHtml, actions){
    $('sheet-title').textContent = title;
    $('sheet-body').innerHTML = bodyHtml;
    const box = $('sheet-actions'); box.innerHTML = '';
    actions.forEach(a => {
      const b = document.createElement('button');
      b.className = 'btn ' + (a.cls || ''); b.textContent = a.label; b.onclick = a.fn;
      box.appendChild(b);
    });
    $('overlay').hidden = false;
  }
  const closeSheet = () => { $('overlay').hidden = true; };
  $('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeSheet(); });

  const fld = (id, label, val, type, extra) =>
    `<label class="fld"><span>${label}</span><input id="${id}" type="${type || 'text'}" value="${esc(val)}" ${extra || ''}></label>`;
  const numAttr = 'inputmode="decimal" step="any" min="0"';

  function openTripSheet(id){
    const t = id ? state.trips.find(x => x.id === id) : null;
    const last = state.trips.length ? state.trips[state.trips.length - 1] : null;
    const z = v => (v ? v : '');
    const d = t || { start: todayIso(), offload:'', route:'', tonnes:'', price: last ? last.price : '', fuel:'', fuelPrice: last ? last.fuelPrice : '', allowance:'', other:'' };
    const body =
      `<div class="row2">${fld('f-start','Start date',d.start,'date')}${fld('f-offload','Offloading date',d.offload,'date')}</div>` +
      fld('f-route','Route (e.g. Nairobi → Mombasa)',d.route,'text','autocomplete="off"') +
      `<div class="row2">${fld('f-tonnes','Tonnes carried',z(d.tonnes),'number',numAttr)}${fld('f-price','Commodity price / tonne (KSh)',z(d.price),'number',numAttr)}</div>` +
      `<div class="row2">${fld('f-fuel','Fuel used (litres)',z(d.fuel),'number',numAttr)}${fld('f-fuelprice','Fuel price / litre (KSh)',z(d.fuelPrice),'number',numAttr)}</div>` +
      `<div class="row2">${fld('f-allow','Driver allowance (KSh)',z(d.allowance),'number',numAttr)}${fld('f-other','Other expenses (KSh)',z(d.other),'number',numAttr)}</div>`;
    const actions = [
      { label:'Cancel', fn: closeSheet },
      { label:'Save', cls:'primary', fn: () => {
          const start = $('f-start').value, route = $('f-route').value.trim();
          if (!start || !route) { alert('Please enter the start date and the route.'); return; }
          const rec = {
            id: t ? t.id : uid(), start, offload: $('f-offload').value, route,
            tonnes: num($('f-tonnes').value), price: num($('f-price').value),
            fuel: num($('f-fuel').value), fuelPrice: num($('f-fuelprice').value),
            allowance: num($('f-allow').value), other: num($('f-other').value)
          };
          if (rec.offload && rec.offload < rec.start && !confirm('The offloading date is before the start date. Save anyway?')) return;
          if (t) state.trips[state.trips.indexOf(t)] = rec; else state.trips.push(rec);
          save();
          const p = start.split('-'); cur = { y: +p[0], m: +p[1] - 1 };   // jump to the month just saved
          closeSheet(); render();
      }}
    ];
    openSheet(t ? 'Edit trip' : 'Add trip', body, actions);
    if (t) {
      const del = document.createElement('button');
      del.className = 'btn danger'; del.textContent = 'Delete this trip'; del.style.marginTop = '10px';
      del.onclick = () => { if (confirm('Delete this trip?')) { state.trips = state.trips.filter(x => x.id !== t.id); save(); closeSheet(); render(); } };
      $('sheet-body').appendChild(del);
    }
  }

  function openSettings(){
    const body =
      fld('s-name','Your name',state.profile.name,'text','autocomplete="off"') +
      fld('s-plate','Truck number plate',state.profile.plate,'text','autocomplete="off" style="text-transform:uppercase"') +
      `<div class="sep"></div><div class="h">Backup (your trips live only on this phone)</div>` +
      `<button class="btn" id="s-export" style="margin-bottom:10px">Save a backup file</button>` +
      `<label class="btn" style="display:block;text-align:center;cursor:pointer">Restore from backup<input id="s-import" type="file" accept=".json,application/json" hidden></label>`;
    openSheet('Settings', body, [
      { label:'Cancel', fn: closeSheet },
      { label:'Save', cls:'primary', fn: () => {
          state.profile = { name: $('s-name').value.trim(), plate: $('s-plate').value.trim().toUpperCase() };
          save(); closeSheet(); render();
      }}
    ]);
    $('s-export').onclick = () => {
      download(new Blob([JSON.stringify(state)], {type:'application/json'}), 'fleetline-driver-backup-' + todayIso() + '.json');
    };
    $('s-import').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const s = JSON.parse(r.result);
          if (!s || !Array.isArray(s.trips)) throw new Error('bad');
          if (!confirm('Replace everything on this phone with the backup (' + s.trips.length + ' trips)?')) return;
          state = { profile: s.profile || {name:'', plate:''}, trips: s.trips };
          save(); closeSheet(); render();
        } catch(err) { alert('That file is not a valid Fleetline Driver backup.'); }
      };
      r.readAsText(file);
    };
  }

  // ---------- downloads ----------
  function download(blob, filename){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  const fileBase = () => 'Trip report - ' + monthLabel() + (state.profile.plate ? ' - ' + state.profile.plate : '');

  // ---------- PDF (print → Save as PDF) ----------
  function reportHtml(){
    const list = monthTrips(), t = totals(list), p = state.profile;
    const rows = list.map((x, i) => `<tr><td>${i+1}</td><td>${fmtDate(x.start)}</td><td>${fmtDate(x.offload)}</td><td>${esc(x.route)}</td>
      <td class="r">${f1(num(x.tonnes))}</td><td class="r">${Math.round(num(x.price)).toLocaleString('en-US')}</td><td class="r">${Math.round(cargoValue(x)).toLocaleString('en-US')}</td>
      <td class="r">${f1(num(x.fuel))}</td><td class="r">${Math.round(num(x.fuelPrice)).toLocaleString('en-US')}</td><td class="r">${Math.round(fuelCost(x)).toLocaleString('en-US')}</td>
      <td class="r">${Math.round(num(x.allowance)).toLocaleString('en-US')}</td><td class="r">${Math.round(num(x.other)).toLocaleString('en-US')}</td></tr>`).join('');
    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(fileBase())}</title><style>
      @page{ size:A4 landscape; margin:10mm; }
      body{ font-family:Arial,Helvetica,sans-serif; color:#181B18; margin:0; padding:6px; }
      h1{ font-size:20px; margin:0 0 2px; } .sub{ color:#555; font-size:12px; margin-bottom:12px; }
      table.sum{ width:auto; margin-bottom:14px; }
      table.sum td{ border:none; padding:0 26px 0 0; font-size:11px; vertical-align:top; }
      table.sum td b{ display:block; font-size:15px; margin-top:2px; }
      table{ width:100%; border-collapse:collapse; font-size:10.5px; }
      th{ background:#EEEDE7; text-align:left; padding:5px 6px; border-bottom:2px solid #CFCBBF; }
      td{ padding:5px 6px; border-bottom:1px solid #E4E2DA; }
      .r{ text-align:right; } th.r{ text-align:right; }
      tr.tot td{ font-weight:700; border-top:2px solid #181B18; border-bottom:none; }
      table.sign{ margin-top:36px; font-size:11px; }
      table.sign td{ width:45%; border:none; border-top:1px solid #181B18; padding:4px 0 0; } table.sign td.gap{ width:10%; border-top:none; }
      tr{ page-break-inside:avoid; }
    </style></head><body>
      <h1>Driver trip report — ${esc(monthLabel())}</h1>
      <div class="sub">Driver: <b>${esc(p.name || '—')}</b> &nbsp;·&nbsp; Truck: <b>${esc(p.plate || '—')}</b> &nbsp;·&nbsp; Generated ${esc(new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}))}</div>
      <table class="sum"><tr>
        <td>Trips<b>${t.trips}</b></td><td>Tonnes<b>${f1(t.tonnes)} t</b></td><td>Cargo value<b>${ksh(t.cargo)}</b></td>
        <td>Fuel used<b>${f1(t.fuel)} L</b></td><td>Fuel cost<b>${ksh(t.fuelCost)}</b></td>
        <td>Allowance<b>${ksh(t.allowance)}</b></td><td>Other expenses<b>${ksh(t.other)}</b></td>
      </tr></table>
      <table><thead><tr><th>#</th><th>Start</th><th>Offloaded</th><th>Route</th><th class="r">Tonnes</th><th class="r">Price/t</th><th class="r">Cargo value</th>
        <th class="r">Fuel (L)</th><th class="r">Fuel price/L</th><th class="r">Fuel cost</th><th class="r">Allowance</th><th class="r">Other</th></tr></thead>
      <tbody>${rows}
        <tr class="tot"><td></td><td colspan="3">Total (KSh unless stated)</td><td class="r">${f1(t.tonnes)}</td><td></td><td class="r">${Math.round(t.cargo).toLocaleString('en-US')}</td>
        <td class="r">${f1(t.fuel)}</td><td></td><td class="r">${Math.round(t.fuelCost).toLocaleString('en-US')}</td><td class="r">${Math.round(t.allowance).toLocaleString('en-US')}</td><td class="r">${Math.round(t.other).toLocaleString('en-US')}</td></tr>
      </tbody></table>
      <table class="sign"><tr><td>Driver signature &amp; date</td><td class="gap"></td><td>Supervisor signature &amp; date</td></tr></table>
    </body></html>`;
  }
  function printHtml(html){
    const w = window.open('', '_blank');
    if (w) {
      w.document.open(); w.document.write(html); w.document.close();
      setTimeout(() => { try { w.focus(); w.print(); } catch(e) {} }, 500);
      return;
    }
    const f = document.createElement('iframe');                       // popup blocked → hidden frame fallback
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';
    document.body.appendChild(f);
    const d = f.contentWindow.document; d.open(); d.write(html); d.close();
    setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 60000); }, 500);
  }

  /*XLSX-START*/
  // Minimal .xlsx writer (no libraries, works fully offline)
  const xe = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function colName(i){ let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  let _crcT = null;
  function crc32(b){
    if (!_crcT) { _crcT = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); _crcT[n] = c >>> 0; } }
    let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = _crcT[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function makeZip(files){                                            // files: [{name, data(Uint8Array)}], stored (no compression)
    const enc = new TextEncoder(), d = new Date();
    const dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const parts = [], central = []; let off = 0;
    files.forEach(f => {
      const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true);
      lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nm, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, dosT, true); ch.setUint16(14, dosD, true); ch.setUint32(16, crc, true); ch.setUint32(20, sz, true); ch.setUint32(24, sz, true);
      ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), nm);
      off += 30 + nm.length + sz;
    });
    const csz = central.reduce((a, p) => a + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, csz, true); end.setUint32(16, off, true);
    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  // cell: plain string/number, or {v, s(style id), f(formula)}
  function sheetXml(rows, widths){
    let x = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>' +
      widths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols><sheetData>';
    rows.forEach((r, ri) => {
      x += `<row r="${ri+1}">`;
      r.forEach((cell, ci) => {
        if (cell == null || cell === '') return;
        const c = (typeof cell === 'object') ? cell : { v: cell };
        const ref = colName(ci) + (ri + 1), s = c.s ? ` s="${c.s}"` : '';
        if (c.f != null) x += `<c r="${ref}"${s}><f>${xe(c.f)}</f><v>${c.v}</v></c>`;
        else if (typeof c.v === 'number') x += `<c r="${ref}"${s}><v>${c.v}</v></c>`;
        else x += `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`;
      });
      x += '</row>';
    });
    return x + '</sheetData></worksheet>';
  }
  const STYLES_XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="0.0"/></numFmts>' +
    '<fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts>' +
    '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8E6DF"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>' +
    '<xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '<xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>' +
    '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
    '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  function buildXlsx(rows, widths, sheetName){
    const enc = new TextEncoder(), H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    return makeZip([
      { name:'[Content_Types].xml', data: enc.encode(H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>') },
      { name:'_rels/.rels', data: enc.encode(H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>') },
      { name:'xl/workbook.xml', data: enc.encode(H + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + xe(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>') },
      { name:'xl/_rels/workbook.xml.rels', data: enc.encode(H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>') },
      { name:'xl/styles.xml', data: enc.encode(STYLES_XML) },
      { name:'xl/worksheets/sheet1.xml', data: enc.encode(sheetXml(rows, widths)) }
    ]);
  }
  function reportRows(list, p, label){
    const t = totals(list);
    const rows = [
      [{v:'Driver trip report — ' + label, s:7}],
      ['Driver', p.name || ''], ['Truck', p.plate || ''], ['Month', label], [],
      ['Start date','Offloading date','Route','Tonnes','Commodity price/t (KSh)','Cargo value (KSh)','Fuel (L)','Fuel price/L (KSh)','Fuel cost (KSh)','Allowance (KSh)','Other expenses (KSh)'].map(h => ({v:h, s:6}))
    ];
    const first = rows.length + 1;
    list.forEach(x => {
      const n = rows.length + 1;
      rows.push([fmtDate(x.start), fmtDate(x.offload), x.route,
        {v:num(x.tonnes), s:3}, {v:num(x.price), s:2},
        {v:cargoValue(x), s:2, f:`D${n}*E${n}`},
        {v:num(x.fuel), s:3}, {v:num(x.fuelPrice), s:2},
        {v:fuelCost(x), s:2, f:`G${n}*H${n}`},
        {v:num(x.allowance), s:2}, {v:num(x.other), s:2}]);
    });
    const last = rows.length;
    const sum = (col, v, s) => ({v, s, f:`SUM(${col}${first}:${col}${last})`});
    rows.push([{v:'TOTAL', s:1}, '', '', sum('D', t.tonnes, 5), '', sum('F', t.cargo, 4), sum('G', t.fuel, 5), '', sum('I', t.fuelCost, 4), sum('J', t.allowance, 4), sum('K', t.other, 4)]);
    return rows;
  }
  /*XLSX-END*/
  const XLSX_WIDTHS = [14, 15, 28, 10, 22, 18, 10, 18, 16, 16, 20];
  function xlsxBlob(){ return buildXlsx(reportRows(monthTrips(), state.profile, monthLabel()), XLSX_WIDTHS, 'Trips'); }

  // ---------- events ----------
  $('prev').onclick = () => { cur = cur.m === 0 ? { y: cur.y - 1, m: 11 } : { y: cur.y, m: cur.m - 1 }; render(); };
  $('next').onclick = () => { cur = cur.m === 11 ? { y: cur.y + 1, m: 0 } : { y: cur.y, m: cur.m + 1 }; render(); };
  $('fab').onclick = () => openTripSheet();
  $('btn-settings').onclick = openSettings;
  $('profile-bar').onclick = openSettings;
  $('trip-list').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openTripSheet(c.dataset.id); });
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  $('btn-pdf').onclick = () => printHtml(reportHtml());
  $('btn-xlsx').onclick = () => download(xlsxBlob(), fileBase() + '.xlsx');
  $('btn-share').onclick = async () => {
    const file = new File([xlsxBlob()], fileBase() + '.xlsx', {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    try { await navigator.share({ files:[file], title: fileBase() }); } catch(e) { /* cancelled */ }
  };
  (function(){
    try {
      const probe = new File([''], 'x.xlsx', {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      if (navigator.canShare && navigator.canShare({ files:[probe] })) $('btn-share').hidden = false;
    } catch(e) {}
  })();

  render();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('driver-service-worker.js', { scope: './driver.html' }).catch(() => {}));
  }
</script>
</body>
